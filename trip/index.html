<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>European Adventure</title>
  <meta name="description" content="Our family trip — reservations, calendar, things to do and places to eat, all in one place." />
  <meta name="theme-color" content="#0e7490" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- App header -->
  <header class="app-header">
    <div class="app-header__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">✈️</span>
        <div class="brand__text">
          <h1 id="trip-title">Trip</h1>
          <p id="trip-subtitle" class="muted"></p>
        </div>
      </div>
      <div id="countdown" class="countdown" aria-live="polite"></div>
    </div>
  </header>

  <!-- Screens -->
  <main id="app">
    <section id="view-home"    class="view" data-view="home"></section>
    <section id="view-calendar" class="view" data-view="calendar" hidden></section>
    <section id="view-reservations" class="view" data-view="reservations" hidden></section>
    <section id="view-todo"    class="view" data-view="todo" hidden></section>
    <section id="view-eat"     class="view" data-view="eat" hidden></section>
    <section id="view-info"    class="view" data-view="info" hidden></section>
  </main>

  <!-- Bottom tab bar -->
  <nav class="tabbar" aria-label="Sections">
    <button class="tab is-active" data-target="home" aria-current="page"><span class="tab__icon">🏠</span><span class="tab__label">Home</span></button>
    <button class="tab" data-target="calendar"><span class="tab__icon">🗓️</span><span class="tab__label">Calendar</span></button>
    <button class="tab" data-target="reservations"><span class="tab__icon">🎫</span><span class="tab__label">Bookings</span></button>
    <button class="tab" data-target="todo"><span class="tab__icon">📍</span><span class="tab__label">Do</span></button>
    <button class="tab" data-target="eat"><span class="tab__icon">🍽️</span><span class="tab__label">Eat</span></button>
    <button class="tab" data-target="info"><span class="tab__icon">ℹ️</span><span class="tab__label">Info</span></button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
