name: Refresh player stats

# Regenerates js/data.js with verified career averages via nba_api.
# Run it manually from the Actions tab. GitHub-hosted runners can usually reach
# stats.nba.com (the sandbox this repo may have been built in cannot).
#
# Heads up: stats.nba.com occasionally rate-limits or blocks cloud IPs. If a run
# fails to resolve players, just re-run it, or run the script locally instead:
#   pip install nba_api && python scripts/build_dataset.py

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the regenerated js/data.js back to the branch"
        type: boolean
        default: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nba_api
        run: pip install nba_api

      - name: Regenerate dataset
        run: python scripts/build_dataset.py

      - name: Commit changes
        if: ${{ inputs.commit }}
        run: |
          if git diff --quiet -- js/data.js; then
            echo "No stat changes to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add js/data.js
            git commit -m "Refresh player career stats via nba_api"
            git push
          fi
