<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Costimator — recipe &amp; menu costing</title>
<meta name="description" content="Cost recipes to the cent: ingredient library, sub-recipes, yield factors, portion cost and GP% menu analysis.">
<meta name="theme-color" content="#12181f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">◧</span>
    <div>
      <h1>Costimator</h1>
      <p class="brand-sub">Recipe &amp; menu costing</p>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="dashboard">Dashboard</button>
    <button class="tab" role="tab" data-view="recipes">Recipes</button>
    <button class="tab" role="tab" data-view="ingredients">Ingredients</button>
    <button class="tab" role="tab" data-view="suppliers">Suppliers</button>
    <button class="tab" role="tab" data-view="invoices">Invoices</button>
    <button class="tab" role="tab" data-view="data">Data</button>
  </nav>
</header>

<main id="view" class="view" role="main"></main>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </header>
    <div id="modal-body" class="modal-body"></div>
    <footer id="modal-foot" class="modal-foot"></footer>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/units.js"></script>
<script src="js/costing.js"></script>
<script src="js/suppliers.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
