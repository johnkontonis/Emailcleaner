<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roost</title>
<meta name="description" content="Roost — menu costing and kitchen control: recipes, supplier prices, purchase orders, invoices and stocktake, with GP analysis weighted by sales.">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 90 90" aria-hidden="true">
        <!-- the roost mark: a bird settled on its perch -->
        <circle cx="30" cy="24" r="9" fill="#e8a020"/>
        <circle cx="45" cy="17" r="9" fill="#e8a020"/>
        <circle cx="60" cy="24" r="9" fill="#e8a020"/>
        <circle cx="45" cy="46" r="23" fill="#e8a020"/>
        <polygon points="66,40 82,47 66,54" fill="#e8a020"/>
        <circle cx="53" cy="40" r="4" fill="#1a1a1a"/>
        <rect x="12" y="74" width="66" height="6" rx="3" fill="#e8a020"/>
      </svg>
      <div>
        <h1>Roost</h1>
        <p class="brand-sub">Menu costing &amp; kitchen control</p>
      </div>
    </div>
    <select id="client-select" class="client-select" aria-label="Client"></select>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="dashboard">Dashboard</button>
    <button class="tab" role="tab" data-view="recipes">Recipes</button>
    <button class="tab" role="tab" data-view="ingredients">Ingredients</button>
    <button class="tab" role="tab" data-view="suppliers">Suppliers</button>
    <button class="tab" role="tab" data-view="orders">Orders</button>
    <button class="tab" role="tab" data-view="invoices">Invoices</button>
    <button class="tab" role="tab" data-view="stocktake">Stocktake</button>
    <button class="tab" role="tab" data-view="data">Data</button>
  </nav>
</header>

<main id="view" class="view" role="main"></main>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </header>
    <div id="modal-body" class="modal-body"></div>
    <footer id="modal-foot" class="modal-foot"></footer>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/units.js"></script>
<script src="js/costing.js"></script>
<script src="js/suppliers.js"></script>
<script src="js/stocktake.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
